[project]
name = "complianceqapipeline"
version = "0.1.0"
description = "Production AI pipeline for FTC compliance auditing of YouTube content"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [

    # Core API
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.12.5",

    # AI / Orchestration
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.6",
    "langsmith>=0.7.26",

    # Observability
    "opentelemetry-instrumentation-fastapi>=0.61b0",

    # Data / Storage
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.11",
    "redis>=7.4.0",
    "pandas>=3.0.2",

    # Utilities
    "requests>=2.33.1",
    "pypdf>=6.9.2",
    "yt-dlp>=2026.3.17",
    "firecrawl-py>=4.22.1",


    # Local AI Inference
    "faster-whisper>=1.0.3",
    "ctranslate2>=4.3.1",

    # OCR
    "rapidocr-onnxruntime>=1.3.24",
    "opencv-python>=4.9.0.80",

    # Image Utilities
    "numpy>=1.26.4",
    "pillow>=10.3.0",


    # Local Retrieval
    "sentence-transformers>=3.0.1",
    "qdrant-client>=1.9.1",

    "langchain-groq>=0.3.8",
]